<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex">
<meta name="theme-color" content="#060806">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/inter-latin-var.woff2?v=1" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Inter;font-style:normal;font-weight:400 800;font-display:swap;src:url(/assets/fonts/inter-latin-var.woff2?v=1) format("woff2")}
@font-face{font-family:"Inter Fallback";src:local("Arial"),local("Helvetica Neue"),local("Helvetica"),local("Liberation Sans");size-adjust:107.5%;ascent-override:90.1%;descent-override:22.4%;line-gap-override:0%}
:root{--bg:#060806;--bg-2:#0a0d0a;--text:#f0fff4;--text-2:#c6d1c7;--muted:#8b9a8c;--accent:#B8E05A;--accent-ink:#0b1206;--line:rgba(240,255,244,.08);--line-strong:rgba(240,255,244,.16);--tight:-.032em}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,'Inter Fallback',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 50% at 70% 10%,rgba(149,191,71,.14),transparent 70%)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px;width:100%}
nav{border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;height:68px}
.brand{display:flex;align-items:center;min-height:44px;gap:11px;font-weight:800;letter-spacing:.16em;font-size:15px}
.brand small{font-weight:500;letter-spacing:.02em;color:var(--muted);font-size:12.5px}
main{flex:1;display:flex;align-items:center;position:relative}
main .wrap{padding-top:72px;padding-bottom:72px}
.micro{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(40px,6vw,76px);line-height:1;letter-spacing:var(--tight);font-weight:800;margin:16px 0 14px}
p{color:var(--text-2);margin:0 0 28px;max-width:560px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;border-radius:999px;padding:13px 24px;font-weight:700;font-size:15.5px;text-align:center}
.btn-a{background:var(--accent);color:var(--accent-ink)}
.btn-g{border:1px solid var(--line-strong)}
.en{margin-top:56px;padding-top:32px;border-top:1px solid var(--line)}
.en h2{font-size:clamp(26px,3vw,36px);letter-spacing:var(--tight);font-weight:800;margin:10px 0 10px;line-height:1.1}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:13.5px;background:var(--bg-2)}
footer a{color:var(--text-2);text-decoration:underline;text-underline-offset:3px}
@media (max-width:640px){.wrap{padding:0 16px}.btn{width:100%}}
</style>
</head>
<body>
<nav aria-label="Hovedmeny"><div class="wrap">
  <a class="brand" href="/"><img src="/assets/icon.svg" alt="" width="28" height="28">DEVPROOF <small>av NOKTO</small></a>
</div></nav>
<main id="innhold"><div class="wrap">
  <span class="micro">404</span>
  <h1>Siden finnes ikke</h1>
  <p>Lenken kan være feil, eller siden er flyttet.</p>
  <div class="cta"><a class="btn btn-a" href="/">Til forsiden</a></div>
  <div class="en" lang="en">
    <span class="micro">404</span>
    <h2>Page not found</h2>
    <p>The link may be wrong, or the page has moved.</p>
    <div class="cta"><a class="btn btn-g" href="/en/" hreflang="en">English homepage</a></div>
  </div>
</div></main>
<footer><div class="wrap">DEVPROOF er laget av NOKTO · <a href="mailto:edin@nokto.no">edin@nokto.no</a></div></footer>
</body>
</html>
